[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a1-chat-history"
version = "0.1.0"
description = "Drop-in conversation history API for A1 agents: FastAPI service with optional local MongoDB (pymongo) or zero-dependency JSON storage."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
a1-chat-history = "a1_chat_history.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
